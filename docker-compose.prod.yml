services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contentfactory
      POSTGRES_USER: contentfactory
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentfactory"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    ports:
      # Наружу отдаёт Caddy (он же терминирует TLS). Docker обходит UFW,
      # поэтому "3800:3800" открыл бы порт в интернет — так нельзя.
      #
      # Но и "127.0.0.1:3800" нельзя: Caddy на СПб живёт В КОНТЕЙНЕРЕ
      # (kukin-erp-caddy-1, сеть kukin-erp_internal) и обращается к
      # `172.18.0.1:3800` — это адрес ХОСТА в его сети, а не loopback.
      # Биндинг на localhost делал бэкенд недостижимым → 502 на /api и /uploads
      # (проявилось 25.07 при первом пересоздании контейнера после b111f53).
      #
      # 172.18.0.1 = шлюз bridge-сети kukin-erp_internal на хосте: публично
      # порт не открыт, но контейнеру Caddy доступен.
      # ⚠️ Связь хрупкая: пересоздание сети kukin-erp может сменить подсеть.
      # Правильное решение — вынести CF в общую с Caddy сеть и проксировать по
      # имени контейнера (тогда порт на хост не публикуется вовсе).
      - "172.18.0.1:3800:3800"
    environment:
      DATABASE_URL: postgresql://contentfactory:${DB_PASSWORD}@postgres:5432/contentfactory
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      KIE_API_KEY: ${KIE_API_KEY}
      NODE_ENV: production
      PORT: 3800
    volumes:
      - uploads_data:/app/uploads
      - /data/google-photos:/app/google-photos:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3800/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G    # запас под загрузку больших видео (до 500 МБ): parseBody буферизует тело
          cpus: '1.5'

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
