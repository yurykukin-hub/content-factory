services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contentfactory
      POSTGRES_USER: contentfactory
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentfactory"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Сервис назван cf-backend, а не backend, ОСОЗНАННО: compose автоматически заводит
  # DNS-алиас по имени сервиса в КАЖДОЙ сети, включая общую с Caddy. Имя `backend`
  # там уже занято бэкендом KB ERP (Caddyfile проксирует `backend:3000` в 8 местах),
  # и второй такой алиас превращал резолв в две A-записи → трафик KB ERP мог уйти в CF.
  cf-backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    # ports НЕ публикуем: Caddy достаёт бэкенд по внутренней сети (см. networks ниже).
    # Docker обходит UFW, поэтому любая публикация порта — риск открыть его в интернет.
    # История: "127.0.0.1:3800" делал бэкенд недостижимым для Caddy (он в контейнере,
    # loopback хоста ему не виден) → 502; "172.18.0.1:3800" работал, но привязывался
    # к подсети чужой сети и сломался бы при её пересоздании.
    environment:
      DATABASE_URL: postgresql://contentfactory:${DB_PASSWORD}@postgres:5432/contentfactory
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      KIE_API_KEY: ${KIE_API_KEY}
      NODE_ENV: production
      PORT: 3800
    volumes:
      - uploads_data:/app/uploads
      - /data/google-photos:/app/google-photos:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal:
      # Сеть общего Caddy (проект kukin-erp). Caddy проксирует на `cf-backend:3800`
      # по DNS Docker — ни порта на хосте, ни привязки к IP-подсети.
      caddy:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3800/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G    # запас под загрузку больших видео (до 500 МБ): parseBody буферизует тело
          cpus: '1.5'

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
  # Внешняя сеть общего Caddy: создаётся проектом kukin-erp, CF только подключается.
  # ⚠️ Если её пересоздать, CF нужно перезапустить (`up -d cf-backend`).
  caddy:
    external: true
    name: kukin-erp_internal
